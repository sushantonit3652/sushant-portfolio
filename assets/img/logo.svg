<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cyan to Violet Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    
    <!-- Deep Glass Fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Hexagon -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="none" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.4" filter="url(#neonGlow)" />

  <!-- Outer Futuristic Hexagon -->
  <polygon points="100,24 166,62 166,138 100,176 34,138 34,62" fill="url(#glassFill)" stroke="url(#cyberGrad)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Geometric S-T Monogram Geometry -->
  <!-- Top T Bar & S Upper Curve -->
  <path d="M 60,65 L 140,65 L 140,78 L 108,78 L 108,100 L 136,100 C 145,100 150,106 150,114 L 150,126 C 150,134 144,140 136,140 L 64,140 L 64,127 L 134,127 L 134,113 L 92,113 C 84,113 78,107 78,99 L 78,87 C 78,79 84,78 92,78 L 92,78 L 60,78 Z" fill="url(#cyberGrad)" />

  <!-- Accent Tech Dots -->
  <circle cx="100" cy="42" r="3.5" fill="#00F0FF" />
  <circle cx="152" cy="72" r="2.5" fill="#8B5CF6" />
  <circle cx="48" cy="128" r="2.5" fill="#EC4899" />
</svg>
